spring:
  config:
    activate:
      on-profile: prod
  application:
    name: member-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/ordermsa?useSSL=false&allowPublicKeyRetrieval=true
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

jwt:
  expiration: 1000
  # 서명 키는 소스에 두지 않고 환경변수로 받는다 (쿠버네티스 시크릿 jwt-secret 에서 주입, 테라폼이 랜덤 생성)
  # Base64 로 인코딩된 64바이트 이상(HS512)이어야 한다. apigateway 와 같은 값을 써야 토큰 검증이 된다
  secretKey: ${JWT_SECRET_KEY}
  expirationRt: 288000
  secretKeyRt: ${JWT_SECRET_KEY_RT}
