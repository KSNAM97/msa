apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-depl
  namespace: soldesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: member
    spec:
      containers:
      - name: member-container
        image: 872792314844.dkr.ecr.ap-northeast-2.amazonaws.com/member-service:latest
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # JWT 서명 키 (apigateway 와 같은 jwt-secret 시크릿. 테라폼이 생성)
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY
        - name: JWT_SECRET_KEY_RT
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET_KEY_RT
        # 초기 관리자(admin) 비밀번호. 시크릿이 없으면 관리자 계정을 만들지 않는다(optional)
        - name: ADMIN_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: admin-secret
              key: ADMIN_PASSWORD
              optional: true
        # 컨테이너 상태 확인 
        readinessProbe:
          httpGet:
            # healthcheck 경로
            path: /health
            port: 8080
          # 컨테이너 시작 후 지연
          initialDelaySeconds: 10
          # 확인 반복 주기
          periodSeconds: 10
        # liveness: 응답이 없으면 컨테이너를 재시작한다 (기동이 느려도 시작 중에 재시작되지 않도록 지연을 넉넉히)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: member
  