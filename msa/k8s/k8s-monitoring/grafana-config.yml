# Grafana 자동 설정 (프로비저닝): 컨테이너가 시작될 때 아래 내용이 자동으로 등록된다 -> 수동 설정 없이 바로 그래프가 보인다
#   1) grafana-datasources : Prometheus(클러스터 안) + CloudWatch(AWS) 를 데이터소스로 등록
#        - CloudWatch 는 Grafana 파드의 서비스어카운트(IRSA, 테라폼이 생성)에 연결된 "읽기 전용" 권한으로 접근한다. 키를 저장하지 않는다
#   2) grafana-dashboard-provider : 대시보드 파일을 읽을 위치를 알려준다 (폴더: NAM97)
#   3) grafana-dashboards : 대시보드 7종
#        - NAM97 MALL 개요 : 서비스 상태/요청/에러/응답시간/JVM            (Prometheus)
#        - Spring Boot JVM : 힙, GC, 스레드, DB 커넥션 풀, 서비스별 요청/응답시간 (Prometheus)
#        - Kubernetes 클러스터 : 노드/파드 CPU, 메모리, 네트워크, 디스크   (Prometheus)
#        - Amazon RDS : DB CPU/연결/스토리지/IOPS/지연                      (CloudWatch)
#        - Amazon EC2 노드 : 워커 노드 CPU/네트워크, EBS 읽기/쓰기          (CloudWatch)
#        - NLB : 정상/비정상 타깃, 연결 수, 처리 바이트, 리셋                (CloudWatch)
#        - CloudWatch Logs : EKS 컨트롤 플레인 로그 유입량                  (CloudWatch)
# [CloudWatch 질의 규칙] 모든 CloudWatch 패널은 검색식(SEARCH) 형태로 작성한다. 일반(빌더) 형식은 Grafana 13 에서 No data 가 나왔다.
#   - 삭제된 옛 EC2/로드밸런서의 지표까지 잡히므로 SORT(..., MAX, DESC, N) 으로 값이 큰 상위 N개만 보여준다.
#   - ingress-nginx 로드밸런서는 NLB(AWS/NetworkELB)다 (terraform addons.tf 의 aws-load-balancer-type: nlb). 종류가 바뀌면 이 대시보드의 네임스페이스도 바꾼다.
# 대시보드는 읽기 전용(코드로 관리)이다. 수정하려면 이 파일(또는 생성 스크립트)을 고치고 push 한다 (ArgoCD 가 반영).
# RDS 대시보드의 DB 식별자(my-cluster-mysql)는 terraform 의 "${var.cluster_name}-mysql" 과 같아야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
      - name: CloudWatch
        uid: cloudwatch
        type: cloudwatch
        access: proxy
        editable: false
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: nam97
        folder: NAM97
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
