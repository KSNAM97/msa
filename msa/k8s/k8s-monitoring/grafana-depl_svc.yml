apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000
          # 관리자 계정/비밀번호: 기본값(admin/admin)을 쓰지 않고, 테라폼이 랜덤 생성한 시크릿 grafana-secret 에서 주입
          # (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD 는 Grafana 가 읽는 환경변수 이름)
          envFrom:
            - secretRef:
                name: grafana-secret
          env:
            # 로그인하면 바로 "NAM97 MALL 개요" 대시보드가 첫 화면으로 열리게 한다
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/nam97-overview.json
          # grafana-config.yml 의 ConfigMap 3개를 Grafana 가 읽는 위치에 마운트한다 -> 시작 시 자동 등록(프로비저닝)
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
          # 컨테이너가 사용할수 있는 리소스의 최대치
            limits:
              cpu: "1"
              memory: "500Mi"
          # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
            requests:
              cpu: "0.5"
              memory: "250Mi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
