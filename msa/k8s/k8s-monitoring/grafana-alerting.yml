# =============================================================================
# Grafana 알람 (자동 등록, ConfigMap) : 문제가 생기면 SNS 토픽 -> 이메일로 알려준다
#   - 연락처: SNS 토픽 (주문 알림/리소스 알림과 같은 토픽 nam97-aws-resource-alerts, 이메일 구독 확인은 이미 되어 있음)
#     토픽 ARN 은 계정 ID 가 들어 있어 repo 에 적지 않고, 테라폼이 grafana-secret 의 SNS_TOPIC_ARN 환경변수로 넣는다
#     인증은 Grafana 파드의 IAM 역할(IRSA, 테라폼 grafana_irsa)이 하며 "이 토픽에 Publish 만" 가능하다
#   - 규칙은 Prometheus 지표 기준. 알람 이름(title)은 SNS 제목이 되므로 영문만 쓴다(SNS 제목은 ASCII 만 허용). 설명은 한글
#   - 데이터가 없을 때(클러스터 시작 직후 등)는 알람을 내지 않는다(noDataState: OK)
#   - 알람이 지나치게 자주 오지 않도록 "5분 이상 계속될 때만(for)" 보낸다
# 적용: 이 파일을 바꾼 뒤 kubectl rollout restart deployment/grafana -n monitoring
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
data:
  alerting.yml: |
    apiVersion: 1

    # ---- 연락처: SNS ----
    contactPoints:
      - orgId: 1
        name: sns-email
        receivers:
          - uid: nam97-sns
            type: sns
            disableResolveMessage: false
            settings:
              topic_arn: $__env{SNS_TOPIC_ARN}
              sigv4:
                region: ap-northeast-2
              subject: '[NAM97 ALERT] {{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
              message: |
                {{ range .Alerts }}{{ .Annotations.summary }}
                {{ .Annotations.description }}
                (상태: {{ .Status }})
                {{ end }}

    # ---- 알림 정책: 모든 알람을 위 연락처로 ----
    policies:
      - orgId: 1
        receiver: sns-email
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h

    # ---- 알람 규칙 ----
    # 각 규칙: A(Prometheus 조회) -> B(마지막 값) -> C(기준 초과 여부)
    groups:
      - orgId: 1
        name: nam97-alerts
        folder: NAM97 Alerts
        interval: 1m
        rules:
          - uid: nam97-svc-down
            title: Service down
            condition: C
            for: 2m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: 서비스 파드가 응답하지 않습니다
              description: 'Prometheus 가 {{ $labels.pod }} 의 지표를 2분 넘게 수집하지 못했습니다 (파드 중지/재시작 중일 수 있음)'
            labels: { severity: critical }
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: 'up{job="spring-services"}' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }], datasource: { type: __expr__, uid: __expr__ } }

          - uid: nam97-pod-cpu
            title: High pod CPU
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: 파드 CPU 사용량이 높습니다
              description: '{{ $labels.pod }} 가 CPU 한도(1코어)의 80% 이상을 5분 넘게 사용 중입니다 (HPA 가 늘어나지 않는지 확인)'
            labels: { severity: warning }
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: 'max by (pod) (rate(container_cpu_usage_seconds_total{namespace="ksnam97",container!=""}[5m]))' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.8] } }], datasource: { type: __expr__, uid: __expr__ } }

          - uid: nam97-jvm-heap
            title: High JVM heap
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: JVM 힙 메모리 사용률이 높습니다
              description: '{{ $labels.pod }} 의 힙 사용률이 85% 를 넘었습니다 (메모리 부족/OOM 위험)'
            labels: { severity: warning }
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: 'sum by (pod) (jvm_memory_used_bytes{area="heap"}) / sum by (pod) (jvm_memory_max_bytes{area="heap"})' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.85] } }], datasource: { type: __expr__, uid: __expr__ } }

          - uid: nam97-http-5xx
            title: High 5xx rate
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: 서버 오류(5xx) 응답이 많습니다
              description: '서비스 {{ $labels.app }} 에서 초당 0.1건 이상의 5xx 오류가 5분 넘게 발생 중입니다'
            labels: { severity: critical }
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: 'sum by (app) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.1] } }], datasource: { type: __expr__, uid: __expr__ } }

          - uid: nam97-slow-response
            title: Slow response
            condition: C
            for: 5m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: 평균 응답 시간이 느립니다
              description: '서비스 {{ $labels.app }} 의 평균 응답 시간이 1초를 넘었습니다 (DB 지연/부하 확인)'
            labels: { severity: warning }
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: 'sum by (app) (rate(http_server_requests_seconds_sum[5m])) / sum by (app) (rate(http_server_requests_seconds_count[5m]))' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [1] } }], datasource: { type: __expr__, uid: __expr__ } }

          - uid: nam97-node-cpu
            title: High node CPU
            condition: C
            for: 10m
            noDataState: OK
            execErrState: OK
            annotations:
              summary: 노드(서버) CPU 사용률이 높습니다
              description: '노드 {{ $labels.instance }} 의 CPU 가 85% 이상으로 10분 넘게 유지 중입니다 (노드 증설/오토스케일러 확인)'
            labels: { severity: warning }
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: prometheus
                model: { refId: A, instant: true, expr: '100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100' }
              - refId: B
                datasourceUid: __expr__
                model: { refId: B, type: reduce, expression: A, reducer: last, datasource: { type: __expr__, uid: __expr__ } }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [85] } }], datasource: { type: __expr__, uid: __expr__ } }
