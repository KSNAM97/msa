# DB 관리 화면 (Adminer): 브라우저에서 RDS MySQL 의 테이블/데이터를 조회·수정·쿼리한다.  주소: https://db.<도메인>
#
# [보안] DB 화면을 인터넷에 여는 것이므로 2중으로 보호한다.
#   1) 접속 자체에 Basic 인증(ingress-nginx): 아이디/비밀번호를 모르면 로그인 화면도 보이지 않는다 (시크릿 adminer-basic-auth, 테라폼이 랜덤 생성)
#   2) Adminer 로그인: RDS 계정(admin)과 DB 비밀번호가 있어야 데이터에 접근한다
#   RDS 자체는 private 서브넷이라 인터넷에서 직접 접근할 수 없고, 이 파드(클러스터 안)를 통해서만 열린다.
# 쓰지 않을 때는 이 파일을 지우거나 replicas 를 0 으로 두면 된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:4
          ports:
            - containerPort: 8080
          # 로그인 화면의 "서버" 칸을 RDS 주소로 미리 채워준다 (테라폼이 만든 시크릿 adminer-config 의 값)
          env:
            - name: ADMINER_DEFAULT_SERVER
              valueFrom:
                secretKeyRef:
                  name: adminer-config
                  key: ADMINER_DEFAULT_SERVER
          resources:
            limits:
              cpu: "0.5"
              memory: "256Mi"
            requests:
              cpu: "0.1"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: monitoring
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: adminer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminer-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    # HTTPS 인증서 자동 발급 (cert-manager, 다른 ingress 와 같은 발급자)
    cert-manager.io/cluster-issuer: my-issuer
    # 접속 인증(Basic): 시크릿 adminer-basic-auth 의 auth 키(htpasswd 형식)를 사용
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: adminer-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "NAM97 DB Admin"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - db.ksnam97.com
      secretName: db-ksnam97-com-tls
  rules:
    - host: db.ksnam97.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080
