apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-ksnam97-com-tls
  namespace: monitoring
spec:
  secretName: monitoring-ksnam97-com-tls
  duration: 2160h      # 90d
  renewBefore: 360h    # 15d
  issuerRef:
    name: my-issuer
    kind: ClusterIssuer
  dnsNames:
  - prometheus.ksnam97.com
  - grafana.ksnam97.com