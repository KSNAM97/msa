apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-depl
  namespace: ksnam97
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering 
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: ordering 
    spec:
      # 보안: root 로 실행 금지, 권한 상승 금지, 불필요한 리눅스 capability 전부 제거
      # 주문 알림(SNS)용 IAM 역할(IRSA)이 연결된 서비스어카운트 (terraform/order_alerts.tf 가 만든다)
      serviceAccountName: ordering
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ordering-container
        image: 872792314844.dkr.ecr.ap-northeast-2.amazonaws.com/ordering-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        # 주문 알림을 보낼 SNS 토픽. 테라폼이 시크릿으로 넣는다 (없으면 알림 꺼짐)
        - name: SNS_TOPIC_ARN
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: SNS_TOPIC_ARN
              optional: true
        - name: AWS_REGION
          value: ap-northeast-2
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # 컨테이너 상태 확인 
        readinessProbe:
          httpGet:
            # healthcheck 경로
            path: /health
            port: 8080
          # 컨테이너 시작 후 지연
          initialDelaySeconds: 10
          # 확인 반복 주기
          periodSeconds: 10
        # liveness: 응답이 없으면 컨테이너를 재시작한다 (기동이 느려도 시작 중에 재시작되지 않도록 지연을 넉넉히)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 3

--- 
apiVersion: v1
kind: Service
metadata:
  name: ordering-service
  namespace: ksnam97
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: ordering