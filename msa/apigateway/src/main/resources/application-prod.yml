spring:
  config:
    activate:
      on-profile: prod

  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - 'https://server.ksnam97.com'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowedCredentials: true

      routes:
        - id: member-service
          predicates:
            - Path=/member-service/**
          filters:
            - StripPrefix=1
          uri: http://member-service

        - id: ordering-service
          predicates:
            - Path=/ordering-service/**
          filters:
            - StripPrefix=1
          uri: http://ordering-service

        - id: product-service
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1
          uri: http://product-service

jwt:
  # 토큰 검증 키: member 서비스가 서명에 쓰는 키와 같은 값이어야 한다. 소스에 두지 않고 환경변수(시크릿 jwt-secret)로 주입
  secretKey: ${JWT_SECRET_KEY}
