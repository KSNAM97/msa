<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품등록 - NAM97 MALL</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="container">
    <section class="form-wrap">
      <h2>상품등록 (관리자)</h2>
      <form id="productForm">
        <div class="field"><label for="name">상품명</label><input id="name" type="text" required></div>
        <div class="field"><label for="category">카테고리</label><input id="category" type="text" placeholder="예: 패션, 전자기기 (메뉴에 자동 반영)"></div>
        <div class="field"><label for="imageFile">상품 이미지</label><input id="imageFile" type="file" accept="image/*" required></div>
        <div class="field"><label for="price">가격(원)</label><input id="price" type="number" min="0" required></div>
        <div class="field"><label for="stockQuantity">재고수량</label><input id="stockQuantity" type="number" min="0" required></div>
        <div class="field"><label for="description">상품설명</label><textarea id="description"></textarea></div>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%">등록하기</button>
        <div id="productMessage" class="message"></div>
      </form>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    renderLayout();
    // 화면 접근 제한(UX 용). 실제 권한 검사는 백엔드에서 해야 안전하다 (리뷰 포인트)
    if (guardLogin() && !isAdmin()) { alert('관리자만 상품을 등록할 수 있습니다.'); window.location.href = '/'; }

    document.getElementById('productForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      // 중복 등록 방지: 요청이 끝날 때까지 버튼을 잠그고 진행 중임을 표시한다.
      // (이미지 업로드는 몇 초 걸려서, 잠그지 않으면 여러 번 눌러 같은 상품이 여러 개 등록된다)
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      submitBtn.textContent = '등록 중...';
      const v = function (id) { return document.getElementById(id).value; };
      // 이미지 업로드이므로 multipart/form-data (FormData). product-service 가 S3 에 저장하고 URL 을 DB 에 기록
      const fd = new FormData();
      ['name', 'category', 'price', 'stockQuantity', 'description'].forEach(function (k) { fd.append(k, v(k)); });
      fd.append('imageFile', document.getElementById('imageFile').files[0]);
      try {
        await apiRequest('/product-service/product/create', { method: 'POST', body: fd });
        // 성공하면 버튼을 다시 풀지 않는다(메인으로 이동하는 동안 재클릭 방지)
        showMessage('productMessage', '상품이 등록되었습니다.', 'success');
        setTimeout(function () { window.location.href = '/'; }, 700);
      } catch (err) {
        // 실패했을 때만 버튼을 풀어서 다시 시도할 수 있게 한다
        submitBtn.disabled = false;
        submitBtn.textContent = '등록하기';
        showMessage('productMessage', '등록에 실패했습니다. 입력값과 로그인 상태를 확인해주세요.', 'error');
      }
    });
  </script>
</body>
</html>
