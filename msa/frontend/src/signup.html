<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - NAM97 MALL</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="container">
    <section class="form-wrap">
      <h2>회원가입</h2>
      <form id="signupForm">
        <div class="field"><label for="name">이름</label><input id="name" type="text" maxlength="30" required></div>
        <div class="field"><label for="loginId">아이디</label><input id="loginId" type="text" required></div>
        <div class="field"><label for="nickname">닉네임</label><input id="nickname" type="text" maxlength="30" required></div>
        <div class="field">
          <label for="email">이메일</label>
          <!-- 최소 조건: 공백 없는 "아이디@도메인.최상위도메인" 형태, 100자 이하 (서버 MemberValidator 와 동일) -->
          <input id="email" type="email" maxlength="100" required
                 pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}"
                 title="name@example.com 형식으로 입력해주세요">
          <small style="color:var(--muted)">name@example.com 형식, 100자 이하</small>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <!-- 최소 조건: 8~64자, 영문과 숫자 포함, 공백 불가 (서버 MemberValidator 와 동일) -->
          <input id="password" type="password" minlength="8" maxlength="64" required
                 pattern="(?=.*[A-Za-z])(?=.*\d)\S{8,64}" title="8~64자, 영문과 숫자를 모두 포함 (공백 불가)">
          <small style="color:var(--muted)">8~64자, 영문과 숫자를 모두 포함 (공백 불가)</small>
        </div>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%">가입하기</button>
        <div id="signupMessage" class="message"></div>
      </form>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    renderLayout();   // 공통 헤더/푸터 (app.js)
    // 가입 요청: POST /member-service/member/create (JSON). 인증 불필요(게이트웨이 공개 경로)
    // 아이디/이메일 중복이면 서버가 오류를 돌려주므로 실패 메시지로 안내한다
    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const v = function (id) { return document.getElementById(id).value; };
      try {
        await apiRequest('/member-service/member/create', {
          method: 'POST',
          body: JSON.stringify({ name: v('name'), loginId: v('loginId'), nickname: v('nickname'), email: v('email'), password: v('password') })
        });
        showMessage('signupMessage', '가입이 완료되었습니다. 로그인 페이지로 이동합니다.', 'success');
        setTimeout(function () { window.location.href = '/login.html'; }, 700);
      } catch (err) {
        showMessage('signupMessage', '가입에 실패했습니다. 아이디/이메일 중복 여부를 확인해주세요.', 'error');
      }
    });
  </script>
</body>
</html>
