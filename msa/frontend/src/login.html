<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - NAM97 MALL</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="container">
    <section class="form-wrap">
      <h2>로그인</h2>
      <form id="loginForm">
        <div class="field"><label for="loginId">아이디</label><input id="loginId" type="text" required></div>
        <div class="field"><label for="password">비밀번호</label><input id="password" type="password" required></div>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%">로그인</button>
        <p style="text-align:center;font-size:13px">계정이 없으신가요? <a href="/signup.html"><b>회원가입</b></a></p>
        <div id="loginMessage" class="message"></div>
      </form>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    renderLayout();
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        // 응답: { token, refreshToken, role, nickname ... } 전체를 localStorage 에 저장
        const result = await apiRequest('/member-service/member/doLogin', {
          method: 'POST',
          body: JSON.stringify({ loginId: document.getElementById('loginId').value, password: document.getElementById('password').value })
        });
        saveAuth(result);
        window.location.href = '/';
      } catch (err) {
        showMessage('loginMessage', '로그인에 실패했습니다. 아이디와 비밀번호를 확인해주세요.', 'error');
      }
    });
  </script>
</body>
</html>
