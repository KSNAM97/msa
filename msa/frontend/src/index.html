<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAM97 MALL</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- 공지띠 + 헤더(로고/카테고리/아이콘)와 푸터는 app.js(renderLayout)가 채운다 -->
  <div id="siteHeader"></div>

  <main class="container">
    <!-- 제목(카테고리/검색어에 따라 바뀜) + 개수 + 정렬 -->
    <div class="section-head" id="productSection">
      <h2 id="listTitle">CURATED BY NAM97</h2>
      <div class="tools">
        <span id="productCount"></span>
        <select id="sortSelect" aria-label="정렬">
          <option value="new">NEWEST</option>
          <option value="low">PRICE LOW</option>
          <option value="high">PRICE HIGH</option>
        </select>
      </div>
    </div>
    <div id="productList" class="grid"></div>
  </main>

  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    renderLayout();   // 공지/헤더/푸터
    loadProducts();   // 상품 목록 (검색 q / 카테고리 cat / 정렬 sort 쿼리 반영)
  </script>
</body>
</html>
