<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - NAM97 MALL</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    /* 관리자 페이지 전용 스타일 (공통 style.css 의 색/여백 변수를 그대로 사용) */
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .tool { display: block; border: 1px solid var(--line); padding: 20px; }
    .tool:hover { border-color: var(--text); }
    .tool b { display: block; font-weight: 400; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
    .tool span { font-size: 12px; color: var(--muted); }
    .health { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .svc { border: 1px solid var(--line); padding: 16px; font-size: 13px; }
    .svc .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #bbb; margin-right: 8px; }
    .svc.up .dot { background: var(--ok); }
    .svc.down .dot { background: var(--danger); }
    .svc small { display: block; margin-top: 6px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="container">
    <section class="panel">
      <h2>서비스 상태</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 14px">각 서비스의 /health 를 게이트웨이를 통해 호출합니다. <button class="btn btn-light" id="refreshBtn" type="button" style="padding:4px 12px">새로고침</button> <span id="checkedAt"></span></p>
      <div class="health" id="health"></div>
    </section>

    <section class="panel">
      <h2>운영 도구</h2>
      <div class="admin-grid" id="tools"></div>
    </section>

    <section class="panel">
      <h2>주문 관리</h2>
      <div id="adminOrders">불러오는 중...</div>
    </section>

    <section class="panel">
      <h2>회원 관리</h2>
      <div id="adminMembers">불러오는 중...</div>
    </section>

    <!-- DB 보기 (읽기 전용): 1인 쇼핑몰이라 운영자가 이 화면에서 바로 데이터를 확인한다. 수정/삭제는 불가 -->
    <section class="panel">
      <h2>데이터베이스 (읽기 전용)</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 14px">테이블을 눌러 내용을 보거나, 아래에 SELECT 쿼리를 직접 실행할 수 있습니다. 비밀번호 컬럼은 가려서 표시됩니다. 수정이 필요하면 각 관리 화면이나 DB 관리(Adminer)를 사용하세요.</p>
      <div id="dbTables" class="admin-grid"></div>
      <div id="dbView" style="margin-top:20px"></div>
      <div style="margin-top:24px">
        <label for="dbSql" style="font-size:12px;letter-spacing:.06em">SQL 조회 (SELECT / SHOW / DESCRIBE, 최대 200행)</label>
        <textarea id="dbSql" style="margin:8px 0;min-height:80px;font-family:monospace" placeholder="예: SELECT category, COUNT(*) AS cnt FROM product GROUP BY category"></textarea>
        <button class="btn" id="dbRun" type="button">실행</button>
        <div id="dbQueryResult" style="margin-top:14px"></div>
      </div>
    </section>

    <section class="panel">
      <h2>쇼핑몰 관리</h2>
      <div class="admin-grid">
        <a class="tool" href="/product-create.html"><b>상품 등록</b><span>새 상품과 이미지를 등록합니다</span></a>
        <a class="tool" href="/"><b>상품 목록 / 삭제</b><span>메인에서 상품별 삭제 버튼을 사용합니다</span></a>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="/assets/app.js"></script>
  <script>
    renderLayout();
    // 화면 접근 제한(UX 용). 상태 조회/삭제 등 실제 권한은 서버(JWT + X-User-Role)에서 검사한다
    if (guardLogin() && !isAdmin()) { alert('관리자만 접근할 수 있습니다.'); window.location.href = '/'; }

    // ---- 운영 도구 링크: 현재 접속 도메인에서 서브도메인을 만들어 연결 (server.ksnam97.com -> grafana.ksnam97.com)
    // 로컬 미리보기(localhost) 등 server. 로 시작하지 않으면 기본 도메인으로 대체
    const base = location.hostname.indexOf('server.') === 0 ? location.hostname.slice('server.'.length) : 'ksnam97.com';
    const region = 'ap-northeast-2';
    const tools = [
      { name: 'Grafana', desc: '메트릭 대시보드', href: 'https://grafana.' + base },
      { name: 'Prometheus', desc: '메트릭 수집/쿼리', href: 'https://prometheus.' + base },
      { name: 'ArgoCD', desc: 'GitOps 배포 현황', href: 'https://argo.' + base },
      { name: 'DB 관리 (Adminer)', desc: 'RDS 테이블/데이터 조회 (접속 인증 + DB 로그인 필요)', href: 'https://db.' + base },
      { name: 'CloudWatch 대시보드', desc: 'RDS/노드 지표 (AWS 콘솔 로그인 필요)', href: 'https://' + region + '.console.aws.amazon.com/cloudwatch/home?region=' + region + '#dashboards:name=nam97-sandbox' },
      { name: 'CloudWatch 알람', desc: '알람 상태 (AWS 콘솔 로그인 필요)', href: 'https://' + region + '.console.aws.amazon.com/cloudwatch/home?region=' + region + '#alarmsV2:' },
      { name: 'EKS 로그', desc: '컨트롤 플레인 로그 (AWS 콘솔 로그인 필요)', href: 'https://' + region + '.console.aws.amazon.com/cloudwatch/home?region=' + region + '#logsV2:log-groups' }
    ];
    // 외부 링크는 새 탭 + noopener (열린 탭이 이 창을 조작하지 못하게)
    document.getElementById('tools').innerHTML = tools.map(function (t) {
      return '<a class="tool" target="_blank" rel="noopener" href="' + esc(t.href) + '"><b>' + esc(t.name) + '</b><span>' + esc(t.desc) + '</span></a>';
    }).join('');

    // ---- 서비스 상태: 게이트웨이를 통해 각 서비스 /health 를 호출 (관리자 토큰이 필요한 경로라 로그인 상태에서만 성공)
    const services = [
      { name: 'Member', url: '/member-service/health' },
      { name: 'Product', url: '/product-service/health' },
      { name: 'Ordering', url: '/ordering-service/health' }
    ];
    async function check() {
      const el = document.getElementById('health');
      const results = [];
      // 하나라도 응답하면 API Gateway 가 살아 있다는 뜻이므로, 게이트웨이 상태는 아래 결과에서 추론한다
      for (const s of services) {
        const t0 = performance.now();
        let ok = false;
        try { await apiRequest(s.url, { method: 'GET', headers: {} }); ok = true; } catch (e) { ok = false; }
        results.push({ name: s.name, ok: ok, ms: Math.round(performance.now() - t0) });
      }
      const gwUp = results.some(function (r) { return r.ok; });
      const rows = [{ name: 'API Gateway', ok: gwUp, ms: null }, { name: 'Frontend', ok: true, ms: null }].concat(results);
      el.innerHTML = rows.map(function (r) {
        return '<div class="svc ' + (r.ok ? 'up' : 'down') + '"><span class="dot"></span><b>' + esc(r.name) + '</b><small>' +
          (r.ok ? '정상' : '응답 없음') + (r.ms != null ? ' · ' + r.ms + 'ms' : '') + '</small></div>';
      }).join('');
      document.getElementById('checkedAt').textContent = '마지막 확인: ' + new Date().toLocaleTimeString();
    }
    document.getElementById('refreshBtn').onclick = check;
    check();
    setInterval(check, 30000);   // 30초마다 자동 갱신

    // ---- 주문 관리: 전체 주문 조회 + 취소(재고 복구). 서버가 ADMIN 권한을 검사한다 (GET /ordering/admin/all)
    // 회원 상세 화면이 회원 목록과 주문 목록을 함께 쓰므로 한 번 받은 데이터를 보관한다
    let allOrders = [], allMembers = [], selectedMemberId = null;

    async function loadAdminOrders() {
      const box = document.getElementById('adminOrders');
      try {
        const orders = await apiRequest('/ordering-service/ordering/admin/all', { method: 'GET', headers: {} });
        allOrders = orders;
        renderMembers();   // 회원별 주문 수/구매액에 반영
        if (!orders.length) { box.innerHTML = '<div class="empty">주문이 없습니다.</div>'; return; }
        box.innerHTML = '<table><thead><tr><th>주문번호</th><th>회원ID</th><th>상품</th><th>수량</th><th>금액</th><th>상태</th><th>주문일</th><th></th></tr></thead><tbody>' +
          orders.map(function (o) {
            return '<tr><td>' + o.id + '</td><td>' + o.memberId + '</td><td>' + esc(o.productName) + '</td><td>' + o.quantity + '</td>' +
              '<td>' + formatPrice(o.price * o.quantity) + '</td>' +
              '<td><span class="status ' + esc(o.status) + '">' + (o.status === 'ORDERED' ? '주문완료' : '취소') + '</span></td>' +
              '<td>' + esc((o.orderedAt || '').replace('T', ' ').slice(0, 16)) + '</td>' +
              '<td>' + (o.status === 'ORDERED' ? '<button class="btn btn-light" type="button" data-cancel="' + o.id + '">취소</button>' : '') + '</td></tr>';
          }).join('') + '</tbody></table>';
        box.onclick = function (e) {
          const b = e.target.closest('button[data-cancel]');
          if (b) cancelOrder(Number(b.dataset.cancel), loadAdminOrders);
        };
      } catch (e) { box.innerHTML = '<div class="empty">주문 목록을 불러오지 못했습니다.</div>'; }
    }

    // ---- 회원 관리: 회원 목록(비밀번호 제외). 서버가 ADMIN 권한을 검사한다 (GET /member/list)
    async function loadAdminMembers() {
      try {
        allMembers = await apiRequest('/member-service/member/list', { method: 'GET', headers: {} });
        renderMembers();
      } catch (e) { document.getElementById('adminMembers').innerHTML = '<div class="empty">회원 목록을 불러오지 못했습니다.</div>'; }
    }

    // 회원 목록 표 + 선택한 회원의 상세(정보 + 그 회원의 주문). 행을 클릭하면 아래에 상세가 열린다.
    // 주문 수/구매액은 취소된 주문을 제외한 값이다 (클라이언트에서 전체 주문을 회원ID 로 모아서 계산)
    function renderMembers() {
      const box = document.getElementById('adminMembers');
      if (!allMembers.length) return;
      const stat = {};   // memberId -> { count, total }
      allOrders.forEach(function (o) {
        if (o.status !== 'ORDERED') return;
        const s = stat[o.memberId] || (stat[o.memberId] = { count: 0, total: 0 });
        s.count += 1; s.total += o.price * o.quantity;
      });
      box.innerHTML = '<table><thead><tr><th>ID</th><th>이름</th><th>아이디</th><th>닉네임</th><th>이메일</th><th>권한</th><th>가입일</th><th>주문 수</th><th>구매액</th></tr></thead><tbody>' +
        allMembers.map(function (m) {
          const s = stat[m.id] || { count: 0, total: 0 };
          return '<tr data-member="' + m.id + '" style="cursor:pointer' + (m.id === selectedMemberId ? ';background:var(--gray)' : '') + '"><td>' + m.id + '</td><td>' + esc(m.name) + '</td><td>' + esc(m.loginId) + '</td><td>' + esc(m.nickname) + '</td><td>' + esc(m.email) +
            '</td><td>' + esc(m.role) + '</td><td>' + esc((m.createdTime || '').replace('T', ' ').slice(0, 10)) + '</td><td>' + s.count + '</td><td>' + formatPrice(s.total) + '</td></tr>';
        }).join('') + '</tbody></table><div id="memberDetail"></div>';
      box.querySelector('tbody').onclick = function (e) {
        const tr = e.target.closest('tr[data-member]');
        if (!tr) return;
        selectedMemberId = Number(tr.dataset.member);
        renderMembers();
      };
      renderMemberDetail();
    }

    function renderMemberDetail() {
      const el = document.getElementById('memberDetail');
      const m = allMembers.find(function (x) { return x.id === selectedMemberId; });
      if (!el || !m) return;
      const orders = allOrders.filter(function (o) { return o.memberId === m.id; });
      el.innerHTML = '<div style="margin-top:20px;padding:20px;border:1px solid var(--line)"><b>' + esc(m.name) + '</b> (' + esc(m.loginId) + ') · ' + esc(m.email) + ' · ' + esc(m.role) +
        '<div style="margin-top:12px;font-size:12px;color:var(--muted)">주문 내역 ' + orders.length + '건</div>' +
        (orders.length ? '<table><thead><tr><th>주문번호</th><th>상품</th><th>수량</th><th>금액</th><th>상태</th><th>주문일</th></tr></thead><tbody>' +
          orders.map(function (o) {
            return '<tr><td>' + o.id + '</td><td>' + esc(o.productName) + '</td><td>' + o.quantity + '</td><td>' + formatPrice(o.price * o.quantity) + '</td><td>' +
              (o.status === 'ORDERED' ? '주문완료' : '취소') + '</td><td>' + esc((o.orderedAt || '').replace('T', ' ').slice(0, 16)) + '</td></tr>';
          }).join('') + '</tbody></table>' : '<div class="empty" style="padding:24px">주문이 없습니다.</div>') + '</div>';
    }
    loadAdminOrders();
    loadAdminMembers();

    // ---- 데이터베이스 보기 (읽기 전용). 서버가 ADMIN 권한과 읽기 전용을 강제한다 (/member/admin/db/*)
    const DB = '/member-service/member/admin/db';

    // 결과(columns, rows)를 표로 그린다. null 은 (null) 로, 모든 값은 이스케이프해서 출력
    function dbTable(res) {
      if (!res.columns.length) return '<div class="empty">결과가 없습니다.</div>';
      return '<div style="overflow:auto"><table><thead><tr>' + res.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        res.rows.map(function (r) {
          return '<tr>' + r.map(function (v) { return '<td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (v === null ? '<i style="color:var(--muted)">(null)</i>' : esc(v)) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>' +
        '<p style="font-size:12px;color:var(--muted)">' + res.rows.length + '행' + (res.truncated ? ' (최대 행 수에서 잘림)' : '') + '</p>';
    }

    async function loadDbTables() {
      const box = document.getElementById('dbTables');
      try {
        const tables = await apiRequest(DB + '/tables', { method: 'GET', headers: {} });
        box.innerHTML = tables.map(function (t) {
          return '<a class="tool" href="#" data-table="' + esc(t.name) + '"><b>' + esc(t.name) + '</b><span>' + t.rows + '행</span></a>';
        }).join('');
        box.onclick = function (e) {
          const a = e.target.closest('a[data-table]');
          if (!a) return;
          e.preventDefault();
          showDbTable(a.dataset.table, 0);
        };
      } catch (e) { box.innerHTML = '<div class="empty">테이블 목록을 불러오지 못했습니다.</div>'; }
    }

    // 테이블 내용(20행씩, 최신순) + 이전/다음 페이지
    async function showDbTable(name, page) {
      const view = document.getElementById('dbView');
      try {
        const res = await apiRequest(DB + '/tables/' + encodeURIComponent(name) + '?page=' + page + '&size=20', { method: 'GET', headers: {} });
        view.innerHTML = '<b>' + esc(name) + '</b> <span style="color:var(--muted);font-size:12px">페이지 ' + (page + 1) + '</span>' + dbTable(res) +
          '<button class="btn btn-light" type="button" data-p="' + (page - 1) + '"' + (page === 0 ? ' disabled' : '') + '>이전</button> ' +
          '<button class="btn btn-light" type="button" data-p="' + (page + 1) + '"' + (res.rows.length < 20 ? ' disabled' : '') + '>다음</button>';
        view.onclick = function (e) {
          const b = e.target.closest('button[data-p]');
          if (b && !b.disabled) showDbTable(name, Number(b.dataset.p));
        };
      } catch (e) { view.innerHTML = '<div class="empty">테이블을 불러오지 못했습니다.</div>'; }
    }

    // SQL 직접 조회. 서버가 SELECT 계열 한 문장만 허용하며, 오류 메시지는 그대로 보여줘서 쿼리를 고칠 수 있게 한다
    document.getElementById('dbRun').onclick = async function () {
      const out = document.getElementById('dbQueryResult');
      const btn = this;
      btn.disabled = true;
      try {
        const res = await apiRequest(DB + '/query', { method: 'POST', body: JSON.stringify({ sql: document.getElementById('dbSql').value }) });
        out.innerHTML = dbTable(res);
      } catch (e) {
        out.innerHTML = '<div class="message error" style="display:block">' + esc((e.message || '실행하지 못했습니다.').slice(0, 300)) + '</div>';
      }
      btn.disabled = false;
    };
    loadDbTables();
  </script>
</body>
</html>
