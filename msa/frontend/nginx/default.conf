# NAM97 MALL 정적 프론트엔드 서버 (컨테이너 포트 80)
# API(/member-service 등)는 여기가 아니라 ingress-nginx 가 apigateway 로 보낸다. 이 서버는 HTML/CSS/JS 만 서빙.
server {
    listen 80;
    server_name _;

    # 보안: 서버 버전 숨김 + 브라우저 보안 헤더 (클릭재킹/MIME 스니핑/Referer 유출/불필요한 기기 권한 차단)
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # 텍스트 리소스 압축 (전송량 절감)
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # 정적 파일이 없으면 404 대신 index.html 로 (직접 URL 입력 시 빈 화면 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CSS/JS 는 브라우저 캐시를 짧게(1시간): 배포 후 새 버전이 곧 반영되도록
    location /assets/ {
        expires 1h;
    }
}
