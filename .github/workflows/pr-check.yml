name: PR check (compile)

# 풀 리퀘스트를 main 에 합치기 전에 4개 서비스가 컴파일되는지 확인한다 (배포 워크플로는 main 에 push 된 뒤에야 빌드하므로, 깨진 코드가 main 에 올라가는 것을 미리 막는다)
# 단위 테스트(gradle test)는 돌리지 않는다: 현재 테스트가 스프링 컨텍스트를 띄우며 MySQL 접속을 요구해서 CI 에서는 실패한다.
#   테스트용 DB(H2 등)를 붙이면 ./gradlew test 로 바꾼다.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [apigateway, member, product, ordering]
    steps:
      - uses: actions/checkout@v4

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: compile ${{ matrix.service }}
        working-directory: msa/${{ matrix.service }}
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --no-daemon
