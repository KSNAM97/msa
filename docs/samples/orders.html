<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문내역 - NAM97 MALL</title>
  <style>/* ==========================================================================
   NAM97 MALL 공통 스타일 (v3: 미니멀 큐레이션 몰 스타일)
   - 흰 배경 + 검정 포인트, 얇은 폰트, 넓은 여백, 큰 이미지 카드
   - 구성: 변수 / 공통 / 헤더 / 상품 목록 / 상세 / 표(장바구니·주문) / 폼 / 푸터 / 토스트 / 반응형
   - 색을 바꾸려면 :root 변수만 수정
   ========================================================================== */
:root {
  --text: #111;
  --muted: #8a8a8a;
  --line: #e8e8e8;
  --bg: #fff;
  --gray: #f4f4f4;      /* 상품 이미지 배경 */
  --danger: #d6352f;    /* 품절/오류 */
  --ok: #1d7a46;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif; font-weight: 300; color: var(--text); background: var(--bg); letter-spacing: -.01em; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; }
.container { width: min(1480px, 94%); margin: 0 auto; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---------- 버튼 / 입력 (모서리 없는 사각형) ---------- */
.btn { display: inline-block; padding: 12px 24px; font-size: 13px; font-weight: 400; letter-spacing: .04em; border: 1px solid var(--text); background: #fff; color: var(--text); cursor: pointer; text-align: center; }
.btn:hover { background: var(--text); color: #fff; }
.btn-primary, .btn-dark { background: var(--text); color: #fff; }
.btn-primary:hover, .btn-dark:hover { background: #333; }
.btn-light { border-color: var(--line); }
.btn-lg { padding: 15px 30px; font-size: 14px; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 0; font-size: 14px; font-family: inherit; font-weight: 300; background: #fff; }
input:focus, select:focus, textarea:focus { border-color: var(--text); outline: 0; }
textarea { min-height: 120px; resize: vertical; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; letter-spacing: .06em; margin-bottom: 6px; }

/* ---------- 상단 공지 띠 ---------- */
.announce { text-align: center; font-size: 12px; padding: 9px 12px; border-top: 3px solid #4a7bd6; border-bottom: 1px solid var(--line); }

/* ---------- 헤더: 로고(좌) / 카테고리 메뉴(중앙) / 아이콘(우) ---------- */
.header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--line); }
.hwrap { width: min(1480px, 94%); margin: 0 auto; min-height: 68px; display: flex; align-items: center; gap: 24px; }
.logo { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
.mainnav { flex: 1; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
.mainnav a { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 0; border-bottom: 1px solid transparent; }
.mainnav a:hover, .mainnav a.active { border-bottom-color: var(--text); }
.icons { display: flex; align-items: center; gap: 18px; margin-left: auto; position: relative; }
.icons button, .icons a { background: none; border: 0; padding: 0; cursor: pointer; position: relative; display: grid; place-items: center; color: var(--text); }
.icons svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.icons .count { position: absolute; top: -7px; right: -9px; font-size: 10px; font-weight: 400; background: var(--text); color: #fff; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }
.menu-btn { display: none !important; }

/* 검색창: 돋보기 클릭 시 헤더 아래로 펼쳐짐 */
.searchbar { display: none; border-top: 1px solid var(--line); background: #fff; }
.searchbar.open { display: block; }
.searchbar form { width: min(1480px, 94%); margin: 0 auto; display: flex; gap: 10px; padding: 14px 0; }
.searchbar input { border: 0; border-bottom: 1px solid var(--text); font-size: 16px; padding: 10px 4px; }

/* 계정 드롭다운 */
.acct-menu { position: absolute; top: 36px; right: 0; min-width: 160px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0, 0, 0, .08); display: none; padding: 6px 0; }
.acct-menu.open { display: block; }
.acct-menu a, .acct-menu button { display: block; width: 100%; text-align: left; padding: 10px 16px; font-size: 13px; }
.acct-menu a:hover, .acct-menu button:hover { background: var(--gray); }
.acct-menu .who { padding: 10px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }

/* ---------- 상품 목록 ---------- */
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 44px 0 20px; gap: 12px; }
.section-head h2 { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }
.tools { display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--muted); }
.tools select { width: auto; border: 0; padding: 4px; font-size: 12px; color: var(--text); cursor: pointer; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px 18px; }
.card { display: flex; flex-direction: column; }
.card .meta { padding: 0 2px 10px; font-size: 12px; line-height: 1.55; min-height: 74px; }
.card .brand { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.card .name { display: block; font-weight: 300; }
.card .price { font-size: 12px; }
.card .price s { color: var(--muted); margin-right: 6px; }
.thumb { position: relative; display: block; background: var(--gray); aspect-ratio: 1 / 1.05; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transition: transform .4s ease; }
.card:hover .thumb img { transform: scale(1.04); }
.thumb .flag { position: absolute; top: 12px; left: 12px; font-size: 11px; letter-spacing: .06em; padding: 3px 8px; background: #fff; }
.thumb .flag.soldout { color: var(--danger); }
.quick { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: rgba(17, 17, 17, .92); color: #fff; border: 0; font-size: 12px; letter-spacing: .1em; cursor: pointer; transform: translateY(100%); transition: transform .2s; }
.card:hover .quick, .quick:focus-visible { transform: none; }
.quick:disabled { display: none; }
.admin-del { margin-top: 6px; padding: 3px 10px; font-size: 11px; border: 1px solid var(--danger); color: var(--danger); background: #fff; cursor: pointer; }
.admin-del:hover { background: var(--danger); color: #fff; }
.empty { padding: 70px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.skeleton { background: linear-gradient(90deg, #eee 25%, #f7f7f7 37%, #eee 63%); background-size: 400% 100%; animation: shimmer 1.3s infinite; aspect-ratio: 1 / 1.3; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---------- 상세 ---------- */
.crumb { font-size: 12px; color: var(--muted); margin: 26px 0 14px; letter-spacing: .04em; }
.crumb a:hover { color: var(--text); }
.detail { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; margin-bottom: 40px; }
.detail-img { background: var(--gray); aspect-ratio: 1 / 1; }
.detail-img img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.detail .brand { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
.detail h1 { font-size: 26px; font-weight: 300; margin: 8px 0 14px; }
.detail .price { font-size: 20px; margin-bottom: 18px; }
.detail p { line-height: 1.8; color: #444; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); }
.qty button { border: 0; background: #fff; width: 38px; height: 40px; font-size: 18px; cursor: pointer; }
.qty input { width: 52px; border: 0; text-align: center; padding: 10px 0; }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.actions .btn { flex: 1; }
.info-box { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.9; }

/* ---------- 표: 장바구니 / 주문내역 ---------- */
.panel { margin: 40px 0; }
.panel h2 { font-size: 12px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 16px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 16px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: middle; }
th { color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; }
td img { width: 72px; height: 72px; object-fit: contain; background: var(--gray); mix-blend-mode: multiply; }
.summary { display: flex; justify-content: flex-end; align-items: center; gap: 22px; margin-top: 22px; font-size: 15px; }
.status { font-size: 11px; letter-spacing: .06em; padding: 3px 9px; border: 1px solid var(--ok); color: var(--ok); }
.status.CANCELED { border-color: var(--danger); color: var(--danger); }

/* ---------- 로그인 / 가입 / 상품등록 ---------- */
.form-wrap { max-width: 460px; margin: 60px auto; }
.form-wrap h2 { font-size: 22px; font-weight: 300; margin: 0 0 26px; }
.message { display: none; margin-top: 14px; padding: 12px; font-size: 13px; border: 1px solid; }
.message.success { color: var(--ok); border-color: var(--ok); }
.message.error { color: var(--danger); border-color: var(--danger); }

/* ---------- 푸터 ---------- */
.footer { margin-top: 90px; border-top: 1px solid var(--line); padding: 40px 0 28px; font-size: 12px; color: var(--muted); }
.footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; margin-bottom: 28px; line-height: 1.9; }
.footer h4 { color: var(--text); font-weight: 400; letter-spacing: .1em; margin: 0 0 8px; font-size: 11px; text-transform: uppercase; }
.footer a { display: block; }
.footer a:hover { color: var(--text); }

/* ---------- 토스트 / 맨위로 ---------- */
.toast-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: #fff; padding: 14px 18px; font-size: 13px; display: flex; gap: 16px; align-items: center; animation: rise .25s ease; }
.toast a { text-decoration: underline; white-space: nowrap; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.to-top { position: fixed; right: 20px; bottom: 76px; width: 42px; height: 42px; border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; display: none; z-index: 90; }
.to-top.show { display: block; }

/* ---------- 반응형 ---------- */
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 26px 10px; }
  .detail { grid-template-columns: 1fr; gap: 24px; }
  .footer .cols { grid-template-columns: 1fr 1fr; }
  .menu-btn { display: grid !important; }
  .hwrap { flex-wrap: wrap; gap: 12px; padding: 10px 0; }
  .mainnav { display: none; order: 3; flex-basis: 100%; justify-content: flex-start; gap: 18px; }
  .mainnav.open { display: flex; }
  .quick { transform: none; position: static; }   /* 모바일은 hover 가 없으므로 담기 버튼을 항상 표시 */
}
</style>

   구성: 1) 유틸  2) 인증  3) 공통 레이아웃(헤더/푸터/토스트)  4) 장바구니  5) 상품 목록/상세  6) 주문내역
   백엔드 호출은 모두 같은 도메인의 /<서비스명>/... 경로 (ingress-nginx -> apigateway 가 라우팅)
   ========================================================================== */
const API_BASE = '';
// 이미지가 없을 때 쓰는 자리표시 (외부 이미지 의존 없이 인라인 SVG)
const PLACEHOLDER_IMAGE = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="#f4f4f4"/>' +
  '<text x="50%" y="50%" fill="#b5b5b5" font-size="34" font-family="Arial" text-anchor="middle">NAM97 MALL</text></svg>');

/* ---------- 1) 유틸 ---------- */

// XSS 방지: 서버/사용자 입력값을 innerHTML 에 넣기 전에 반드시 통과시킨다
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function formatPrice(value) { return Number(value || 0).toLocaleString() + '원'; }
function getImageUrl(url) { return url || PLACEHOLDER_IMAGE; }
function getQueryParam(name) { return new URLSearchParams(window.location.search).get(name); }

function showMessage(targetId, message, type) {
  const el = document.getElementById(targetId);
  if (!el) return;
  el.className = 'message ' + type;
  el.textContent = message;          // textContent: 메시지는 HTML 로 해석하지 않음
  el.style.display = 'block';
}

// 화면 우하단 알림. alert() 처럼 흐름을 막지 않고 3.5초 뒤 사라진다. href 를 주면 바로가기 링크가 붙는다
function toast(message, href, linkText) {
  let wrap = document.getElementById('toastWrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toastWrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span>' + esc(message) + '</span>' + (href ? '<a href="' + esc(href) + '">' + esc(linkText || '보기') + '</a>' : '');
  wrap.appendChild(t);
  setTimeout(function () { t.remove(); }, 3500);
}

// fetch 래퍼: JWT 자동 첨부, 401 이면 로그인 화면으로 보낸다
async function apiRequest(url, options) {
  options = options || {};
  const headers = options.headers || {};
  const token = getToken();
  if (token) headers.Authorization = 'Bearer ' + token;
  // FormData(이미지 업로드)는 브라우저가 boundary 를 포함해 Content-Type 을 직접 설정해야 하므로 건드리지 않는다
  if (!headers['Content-Type'] && !(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';

  const response = await fetch(API_BASE + url, Object.assign({}, options, { headers: headers }));

  if (response.status === 401 && token) {   // 토큰 만료/위조: 저장된 로그인 정보를 지우고 재로그인
    clearAuth();
    window.location.href = '/login.html';
    throw new Error('로그인이 필요합니다.');
  }
  if (!response.ok) {
    throw new Error((await response.text()) || '요청 처리 중 오류가 발생했습니다.');
  }
  const type = response.headers.get('content-type') || '';
  return type.includes('application/json') ? response.json() : response.text();
}

// 상품 목록은 헤더 메뉴/목록/타일이 함께 쓰므로 한 번만 요청해 재사용한다 (실패하면 다음에 다시 시도)
let _productsPromise = null;
function getProducts() {
  if (!_productsPromise) {
    _productsPromise = apiRequest('/product-service/product/list', { method: 'GET', headers: {} })
      .catch(function (e) { _productsPromise = null; throw e; });
  }
  return _productsPromise;
}

/* ---------- 2) 인증 (JWT 는 localStorage 에 보관) ---------- */
function saveAuth(data) { localStorage.setItem('auth', JSON.stringify(data)); }
function getAuth() { try { return JSON.parse(localStorage.getItem('auth')); } catch (e) { return null; } }
function clearAuth() { localStorage.removeItem('auth'); }
function getToken() { const a = getAuth(); return a ? a.token : null; }
function isAdmin() { const a = getAuth(); return !!a && a.role === 'ADMIN'; }

// 로그인이 필요한 페이지/동작에서 호출. 미로그인이면 로그인 화면으로 이동
function guardLogin() {
  if (!getToken()) {
    alert('로그인 후 이용해주세요.');
    window.location.href = '/login.html';
    return false;
  }
  return true;
}

/* ---------- 3) 공통 레이아웃: 모든 페이지의 헤더/푸터를 한 곳에서 생성 ---------- */

// 헤더 아이콘 (외부 아이콘 라이브러리 없이 인라인 SVG)
const ICON = {
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>',

};

// 각 HTML 의 <div id="siteHeader"> / <div id="siteFooter"> 안을 채운다
function renderLayout() {
  const auth = getAuth();
  // 계정 드롭다운: 로그인 여부/권한에 따라 항목이 달라진다. 상품등록은 ADMIN 에게만 노출(서버 권한 검사는 별도 과제)
  const acct = auth
    ? '<div class="who">' + esc(auth.nickname || auth.name || auth.loginId) + '님</div>' +
      '<a href="/mypage.html">내 정보</a><a href="/orders.html">주문내역</a>' + (isAdmin() ? '<a href="/admin.html">관리자</a><a href="/product-create.html">상품등록</a>' : '') +
      '<button type="button" id="logoutBtn">로그아웃</button>' +
      (isAdmin() ? '' : '<a href="/withdraw.html">회원탈퇴</a>')   // 관리자는 탈퇴 불가(서버도 거절)

      '<header class="header"><div class="hwrap">' +
        '<a class="logo" href="/">NAM97</a>' +
        '<nav class="mainnav" id="catNav"><a href="/">ALL</a></nav>' +   // 카테고리는 상품 조회 후 채워진다
        '<div class="icons">' +
          '<button type="button" id="searchToggle" aria-label="검색">' + ICON.search + '</button>' +
          '<a href="/cart.html" aria-label="장바구니">' + ICON.bag + '<span class="count" id="cartCount">' + cartTotalQty() + '</span></a>' +
          '<button type="button" id="acctToggle" aria-label="계정">' + ICON.user + '</button>' +
          '<button type="button" class="menu-btn" id="menuToggle" aria-label="메뉴">' + ICON.menu + '</button>' +
          '<div class="acct-menu" id="acctMenu">' + acct + '</div>' +
        '</div></div>' +
        '<div class="searchbar" id="searchBar"><form action="/" method="get"><input name="q" placeholder="상품명, 카테고리 검색" value="' + esc(getQueryParam('q') || '') + '"><button class="btn" type="submit">SEARCH</button></form></div>' +
      '</header>';

    // 토글 동작: 검색창 / 계정 메뉴 / 모바일 메뉴. 바깥을 클릭하면 계정 메뉴를 닫는다
    const $ = function (id) { return document.getElementById(id); };
    $('searchToggle').onclick = function () { $('searchBar').classList.toggle('open'); if ($('searchBar').classList.contains('open')) $('searchBar').querySelector('input').focus(); };
    $('acctToggle').onclick = function (e) { e.stopPropagation(); $('acctMenu').classList.toggle('open'); };
    $('menuToggle').onclick = function () { $('catNav').classList.toggle('open'); };
    document.addEventListener('click', function () { $('acctMenu').classList.remove('open'); });
    const logout = $('logoutBtn');
    // 로그아웃: 이 브라우저에 남은 장바구니도 지운다(서버에는 저장돼 있어서 다시 로그인하면 복원됨. 공용 PC 에서 다른 사람에게 보이지 않게)
    if (logout) logout.onclick = function () {
      clearAuth(); localStorage.removeItem('cart'); sessionStorage.removeItem('cartSynced');
      window.location.href = '/';
    };

    // 카테고리 메뉴: 상품의 category 값으로 자동 생성 (별도 카테고리 API 없이 동작). 실패해도 ALL 만 보이고 화면은 정상
    getProducts().then(function (products) {

      const cats = Array.from(new Set(products.map(function (p) { return p.category; }).filter(Boolean)));

        return '<a href="/?cat=' + encodeURIComponent(c) + '"' + (c === active ? ' class="active"' : '') + '>' + esc(c) + '</a>';

  const footer = document.getElementById('siteFooter');
  if (footer) {
    footer.innerHTML =

        '<div><h4>Shop</h4><a href="/">전체 상품</a><a href="/cart.html">장바구니</a><a href="/orders.html">주문내역</a></div>' +
        '<div><h4>Member</h4><a href="/login.html">로그인</a><a href="/signup.html">회원가입</a></div>' +

// 스크롤을 내리면 나타나는 "맨위로" 버튼
function initToTop() {
  const b = document.createElement('button');
  b.className = 'to-top'; b.type = 'button'; b.setAttribute('aria-label', '맨 위로'); b.textContent = '↑';
  b.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };

  window.addEventListener('scroll', function () { b.classList.toggle('show', window.scrollY > 400); });
}

/* ---------- 4) 장바구니 (서버 API 가 없으므로 브라우저 localStorage 에 보관) ---------- */
// ponytail: 기기/브라우저 단위 장바구니. 로그인 계정과 동기화하려면 cart 서비스 추가 필요
function getCart() { try { return JSON.parse(localStorage.getItem('cart')) || []; } catch (e) { return []; } }
// 저장: 브라우저(localStorage)에 즉시 반영하고, 로그인 상태면 서버에도 보낸다(기기를 바꿔도 장바구니가 유지되도록)
function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); updateCartBadge(); pushCartToServer(cart); }

// 서버에는 상품 ID 와 수량만 저장한다(이름/가격은 화면이 상품 목록에서 채우므로 가격이 바뀌어도 최신으로 보인다).
// 실패해도 화면 동작에는 영향이 없다(localStorage 가 기준). keepalive: 페이지를 바로 이동해도 요청이 끝까지 전송됨
function pushCartToServer(cart) {
  if (!getToken()) return;
  apiRequest('/ordering-service/ordering/cart', {
    method: 'PUT', keepalive: true,
    body: JSON.stringify(cart.map(function (i) { return { productId: i.id, quantity: i.qty }; }))
  }).catch(function () {});
}

// 로그인 상태에서 페이지를 열 때 한 번(탭당) 서버 장바구니를 가져와 로컬과 합친다.
// 합치기 규칙: 같은 상품은 수량이 큰 쪽을 사용 / 삭제됐거나 품절인 상품은 제외 / 수량은 재고를 넘지 않게 제한
async function syncCartFromServer() {
  const token = getToken();
  if (!token || sessionStorage.getItem('cartSynced') === token.slice(-16)) return;
  try {
    const results = await Promise.all([
      apiRequest('/ordering-service/ordering/cart', { method: 'GET', headers: {} }),
      getProducts()
    ]);
    const server = results[0], byId = {};
    results[1].forEach(function (p) { byId[p.id] = p; });
    const qtyById = {};
    getCart().forEach(function (i) { qtyById[i.id] = i.qty; });                       // 로그인 전에 담은 것
    server.forEach(function (s) { qtyById[s.productId] = Math.max(qtyById[s.productId] || 0, s.quantity); });
    const merged = Object.keys(qtyById).map(function (id) {
      const p = byId[id];
      return p && p.stockQuantity > 0
        ? { id: p.id, name: p.name, price: p.price, imageUrl: p.imageUrl, stock: p.stockQuantity, qty: Math.min(qtyById[id], p.stockQuantity) }
        : null;
    }).filter(Boolean);
    saveCart(merged);
    sessionStorage.setItem('cartSynced', token.slice(-16));
    renderCartPage();   // 장바구니 페이지가 열려 있으면 합쳐진 내용으로 다시 그린다
  } catch (e) { /* 동기화 실패 시 로컬 장바구니를 그대로 사용 */ }
}
function cartTotalQty() { return getCart().reduce(function (s, i) { return s + i.qty; }, 0); }
function updateCartBadge() { const el = document.getElementById('cartCount'); if (el) el.textContent = cartTotalQty(); }

// 같은 상품이 이미 있으면 수량만 더한다. 재고(stock)를 넘지 않게 제한
function addToCart(product, qty) {
  const cart = getCart();
  const item = cart.find(function (i) { return i.id === product.id; });
  const next = Math.min((item ? item.qty : 0) + qty, product.stockQuantity);
  if (item) item.qty = next;
  else cart.push({ id: product.id, name: product.name, price: product.price, imageUrl: product.imageUrl, stock: product.stockQuantity, qty: next });
  saveCart(cart);
}

// 장바구니 화면 렌더링 + 수량변경/삭제/주문하기 이벤트 연결
function renderCartPage() {
  const box = document.getElementById('cartBox');
  if (!box) return;
  const cart = getCart();
  if (!cart.length) {
    box.innerHTML = '<div class="empty">장바구니가 비어 있습니다.<br><br><a class="btn" href="/">쇼핑 계속하기</a></div>';
    return;
  }
  const total = cart.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  box.innerHTML =
    '<table><thead><tr><th></th><th>상품</th><th>가격</th><th>수량</th><th>합계</th><th></th></tr></thead><tbody>' +
    cart.map(function (i) {
      return '<tr><td><img src="' + esc(getImageUrl(i.imageUrl)) + '" alt=""></td>' +
        '<td><a href="/product-detail.html?id=' + i.id + '">' + esc(i.name) + '</a></td>' +
        '<td>' + formatPrice(i.price) + '</td>' +
        '<td><div class="qty"><button type="button" data-act="dec" data-id="' + i.id + '">-</button>' +
        '<input value="' + i.qty + '" readonly><button type="button" data-act="inc" data-id="' + i.id + '">+</button></div></td>' +
        '<td>' + formatPrice(i.price * i.qty) + '</td>' +
        '<td><button class="btn btn-light" type="button" data-act="del" data-id="' + i.id + '">삭제</button></td></tr>';
    }).join('') +
    '</tbody></table><div class="summary"><span>총 결제금액 <b>' + formatPrice(total) + '</b></span>' +
    '<button class="btn btn-primary btn-lg" id="checkoutBtn" type="button">주문하기</button></div><div id="cartMessage" class="message"></div>';

  // 이벤트 위임: 표 안의 버튼 클릭을 한 곳에서 처리
  box.querySelector('tbody').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    let next = getCart();
    const item = next.find(function (i) { return i.id === id; });
    if (btn.dataset.act === 'inc' && item.qty < item.stock) item.qty++;
    if (btn.dataset.act === 'dec' && item.qty > 1) item.qty--;
    if (btn.dataset.act === 'del') next = next.filter(function (i) { return i.id !== id; });
    saveCart(next);
    renderCartPage();
  });
  document.getElementById('checkoutBtn').addEventListener('click', checkout);
}

// 주문하기: 백엔드에 "장바구니 일괄 주문" API 가 없어서 상품별로 /ordering/create 를 순서대로 호출한다.
// 성공한 상품만 장바구니에서 제거하고, 실패한 상품은 남겨서 사용자가 다시 시도할 수 있게 한다.
async function checkout() {
  if (!guardLogin()) return;
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  const failed = [];
  let remaining = getCart();
  for (const item of getCart()) {
    try {
      await apiRequest('/ordering-service/ordering/create', {
        method: 'POST', body: JSON.stringify({ productId: item.id, productCount: item.qty })
      });
      remaining = remaining.filter(function (i) { return i.id !== item.id; });
    } catch (e) {
      failed.push(item.name);     // 재고 부족 등
    }
  }
  saveCart(remaining);
  if (failed.length) {
    renderCartPage();
    showMessage('cartMessage', '주문하지 못한 상품: ' + failed.join(', ') + ' (재고를 확인해주세요)', 'error');
  } else {
    window.location.href = '/orders.html?done=1';
  }
}

/* ---------- 5) 상품 목록 / 상세 ---------- */

// 메인 목록: 서버에서 전체를 받아 검색(q)/카테고리(cat)/정렬(sort)을 브라우저에서 처리한다
// ponytail: 상품 수가 수천 개로 늘면 서버 페이징/검색 API 로 교체
async function loadProducts() {
  const list = document.getElementById('productList');
  if (!list) return;
  // 로딩 중에는 회색 자리표시(스켈레톤)를 보여 준다
  list.innerHTML = new Array(8).join('<div class="skeleton"></div>') + '<div class="skeleton"></div>';

  let products;
  try {
    products = await getProducts();
  } catch (e) {
    list.innerHTML = '<div class="empty">상품 목록을 불러오지 못했습니다.</div>';
    return;
  }
  const q = (getQueryParam('q') || '').toLowerCase();
  const cat = getQueryParam('cat') || '';
  const sort = getQueryParam('sort') || 'new';

  const shown = products.filter(function (p) {
    return (!cat || p.category === cat) &&
      (!q || (p.name + ' ' + (p.category || '') + ' ' + (p.description || '')).toLowerCase().includes(q));
  });
  const sorters = {
    'new': function (a, b) { return b.id - a.id; },
    'low': function (a, b) { return a.price - b.price; },
    'high': function (a, b) { return b.price - a.price; }
  };
  shown.sort(sorters[sort] || sorters['new']);

  document.getElementById('listTitle').textContent = q ? 'SEARCH: ' + q : (cat ? cat : 'CURATED BY NAM97');
  document.getElementById('productCount').textContent = shown.length + ' items';
  const sel = document.getElementById('sortSelect');
  sel.value = sort;
  sel.onchange = function () {   // 정렬 변경 시 다른 조건(q, cat)은 유지한 채 URL 만 바꿔 다시 로드
    const p = new URLSearchParams(window.location.search); p.set('sort', sel.value);
    window.location.search = p.toString();
  };

  // 카드 구성: 텍스트(카테고리/이름/가격)가 위, 큰 이미지가 아래. 마우스를 올리면 "ADD TO CART" 가 나타난다
  list.innerHTML = shown.length ? shown.map(function (p) {
    const flag = p.stockQuantity < 1 ? '<span class="flag soldout">SOLD OUT</span>' : (p.stockQuantity < 6 ? '<span class="flag">잔여 ' + p.stockQuantity + '개</span>' : '');
    return '<article class="card"><div class="meta"><div class="brand">' + esc(p.category || 'NAM97') + '</div>' +
      '<a class="name" href="/product-detail.html?id=' + p.id + '">' + esc(p.name) + '</a><div class="price">' + formatPrice(p.price) + '</div>' +
      (isAdmin() ? '<button class="admin-del" type="button" data-del="' + p.id + '">삭제</button>' : '') + '</div>' +   // 관리자에게만 보이는 삭제 버튼
      '<a class="thumb" href="/product-detail.html?id=' + p.id + '"><img loading="lazy" src="' + esc(getImageUrl(p.imageUrl)) + '" alt="' + esc(p.name) + '">' + flag +
      '<button class="quick" type="button" data-add="' + p.id + '"' + (p.stockQuantity < 1 ? ' disabled' : '') + '>ADD TO CART</button></a></article>';
  }).join('') : '<div class="empty">조건에 맞는 상품이 없습니다.</div>';

  // 목록에서 바로 담기 (수량 1). 버튼이 링크(a) 안에 있으므로 기본 이동을 막는다
  list.onclick = function (e) {
    const d = e.target.closest('button[data-del]');
    if (d) {   // 관리자 삭제: 확인 후 DELETE 호출, 성공하면 카드를 화면에서 제거
      const id = Number(d.dataset.del), p = products.find(function (x) { return x.id === id; });
      deleteProduct(id, p ? p.name : '', function () { d.closest('.card').remove(); });
      return;
    }
    const b = e.target.closest('button[data-add]');
    if (!b) return;
    e.preventDefault();
    addToCart(products.find(function (p) { return p.id === Number(b.dataset.add); }), 1);
    toast('장바구니에 담았습니다.', '/cart.html', '장바구니 보기');
  };
}

// 상품 삭제 (관리자). 서버도 ADMIN 이 아니면 403 으로 거절한다. 성공하면 onDone 콜백 실행
async function deleteProduct(id, name, onDone) {
  if (!confirm('"' + name + '" 상품을 삭제할까요? 되돌릴 수 없습니다.')) return;
  try {
    await apiRequest('/product-service/product/' + id, { method: 'DELETE' });
    _productsPromise = null;   // 상품 목록 캐시 무효화 (헤더 카테고리 메뉴 등이 다시 조회하도록)
    toast('삭제했습니다.');
    if (onDone) onDone();
  } catch (e) {
    toast('삭제하지 못했습니다. 관리자 로그인 상태를 확인해주세요.');
  }
}

// 상세: 수량 선택 + 장바구니 담기 + 바로 구매
async function loadProductDetail() {
  const target = document.getElementById('productDetail');
  if (!target) return;
  const id = getQueryParam('id');
  if (!id) { target.innerHTML = '<div class="empty">상품 정보가 없습니다.</div>'; return; }

  let p;
  try {
    p = await apiRequest('/product-service/product/' + encodeURIComponent(id), { method: 'GET', headers: {} });
  } catch (e) {
    target.innerHTML = '<div class="empty">상품 정보를 불러오지 못했습니다.</div>';
    return;
  }
  document.title = p.name + ' - NAM97 MALL';
  const soldOut = p.stockQuantity < 1;
  target.innerHTML =
    '<div class="crumb"><a href="/">HOME</a> / ' + (p.category ? '<a href="/?cat=' + encodeURIComponent(p.category) + '">' + esc(p.category) + '</a> / ' : '') + esc(p.name) + '</div>' +
    '<section class="detail"><div class="detail-img"><img src="' + esc(getImageUrl(p.imageUrl)) + '" alt="' + esc(p.name) + '"></div><div>' +
    '<div class="brand">' + esc(p.category || 'NAM97') + '</div><h1>' + esc(p.name) + '</h1>' +
    '<div class="price">' + formatPrice(p.price) + '</div>' +
    '<p>' + esc(p.description || '상품 설명이 없습니다.') + '</p>' +
    '<p>재고: ' + (soldOut ? '<b>품절</b>' : p.stockQuantity + '개') + '</p>' +
    '<div class="qty"><button type="button" id="qMinus">-</button><input id="qty" value="1" readonly><button type="button" id="qPlus">+</button></div>' +
    '<div class="actions"><button class="btn btn-lg" id="addBtn" type="button"' + (soldOut ? ' disabled' : '') + '>ADD TO CART</button>' +
    '<button class="btn btn-primary btn-lg" id="buyBtn" type="button"' + (soldOut ? ' disabled' : '') + '>BUY NOW</button></div>' +
    '<div id="detailMessage" class="message"></div>' +
    '<div class="info-box">배송: 3만원 이상 무료배송, 오늘 주문 내일 도착<br>반품: 수령 후 7일 이내 가능</div>' +
    (isAdmin() ? '<button class="btn btn-light" id="delBtn" type="button" style="margin-top:18px">이 상품 삭제 (관리자)</button>' : '') +
    '</div></section>';
  const delBtn = document.getElementById('delBtn');   // 관리자에게만 존재. 삭제 성공 시 메인으로 이동
  if (delBtn) delBtn.onclick = function () { deleteProduct(p.id, p.name, function () { setTimeout(function () { window.location.href = '/'; }, 600); }); };

  const qtyEl = document.getElementById('qty');
  document.getElementById('qMinus').onclick = function () { if (+qtyEl.value > 1) qtyEl.value = +qtyEl.value - 1; };
  document.getElementById('qPlus').onclick = function () { if (+qtyEl.value < p.stockQuantity) qtyEl.value = +qtyEl.value + 1; };
  document.getElementById('addBtn').onclick = function () {
    addToCart(p, +qtyEl.value);
    toast('장바구니에 담았습니다.', '/cart.html', '장바구니 보기');
  };
  document.getElementById('buyBtn').onclick = async function () {
    if (!guardLogin()) return;
    this.disabled = true;
    try {
      await apiRequest('/ordering-service/ordering/create', { method: 'POST', body: JSON.stringify({ productId: p.id, productCount: +qtyEl.value }) });
      window.location.href = '/orders.html?done=1';
    } catch (e) {
      this.disabled = false;
      showMessage('detailMessage', '구매에 실패했습니다. 재고를 확인해주세요.', 'error');
    }
  };
}

/* ---------- 6) 주문내역 (백엔드 GET /ordering/my) ---------- */

// 주문 취소 (본인 또는 관리자). 성공하면 재고가 복구되고 onDone 콜백으로 목록을 새로 그린다
async function cancelOrder(orderId, onDone) {
  if (!confirm('이 주문을 취소할까요? 재고가 복구되며 되돌릴 수 없습니다.')) return;
  try {
    await apiRequest('/ordering-service/ordering/' + orderId + '/cancel', { method: 'POST', headers: {} });
    _productsPromise = null;   // 재고가 바뀌었으므로 상품 목록 캐시를 비운다
    toast('주문을 취소했습니다.');
    if (onDone) onDone();
  } catch (e) {
    toast('취소하지 못했습니다. 이미 취소됐거나 권한이 없는 주문입니다.');
  }
}

async function loadOrders() {
  const box = document.getElementById('orderBox');
  if (!box || !guardLogin()) return;
  if (getQueryParam('done')) showMessage('orderMessage', '주문이 완료되었습니다. 감사합니다!', 'success');
  try {
    const orders = await apiRequest('/ordering-service/ordering/my', { method: 'GET', headers: {} });
    if (!orders.length) { box.innerHTML = '<div class="empty">주문 내역이 없습니다.</div>'; return; }
    box.innerHTML = '<table><thead><tr><th></th><th>상품</th><th>수량</th><th>금액</th><th>상태</th><th>주문일</th><th></th></tr></thead><tbody>' +
      orders.map(function (o) {
        return '<tr><td><img src="' + esc(getImageUrl(o.imageUrl)) + '" alt=""></td><td>' + esc(o.productName) + '</td><td>' + o.quantity + '</td>' +
          '<td>' + formatPrice(o.price * o.quantity) + '</td><td><span class="status ' + esc(o.status) + '">' + (o.status === 'ORDERED' ? '주문완료' : '취소') + '</span></td>' +
          '<td>' + esc((o.orderedAt || '').replace('T', ' ').slice(0, 16)) + '</td>' +
          // 주문완료 상태에서만 취소 버튼 노출 (서버도 본인 주문/이미 취소된 주문을 검사한다)
          '<td>' + (o.status === 'ORDERED' ? '<button class="btn btn-light" type="button" data-cancel="' + o.id + '">주문 취소</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    box.onclick = function (e) {
      const b = e.target.closest('button[data-cancel]');
      if (b) cancelOrder(Number(b.dataset.cancel), loadOrders);
    };
  } catch (e) {
    box.innerHTML = '<div class="empty">주문 내역을 불러오지 못했습니다.</div>';
  }
}
</script>
  <script>
    renderLayout();
    loadOrders();   // 로그인 필요. GET /ordering-service/ordering/my
  </script>
</body>
</html>
